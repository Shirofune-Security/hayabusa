name: Release artifact cleanup tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/scripts/cleanup-release-artifacts*.cjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-artifacts.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/cleanup-release-artifacts*.cjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-artifacts.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test cleanup safeguards
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await exec.exec(process.execPath, ['--test', '.github/scripts/cleanup-release-artifacts.test.cjs']);
